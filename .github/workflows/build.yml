# Build the on-device APK with NDK 27.2
#
# Compiles llama.cpp (fetched by CMake at build time) into libharness_llama.so,
# packages it with the Kotlin code, and uploads an installable debug APK.
#
# Download: Actions run page → Artifacts → "androidharness-debug".

name: Build AndroidHarness (on-device llama.cpp)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Ubuntu runners ship Android SDK but the path varies. Install NDK + SDK
      # using the sdkmanager that is already on the runner, no third-party
      # action in the path. Guard against licence prompts with `yes |`.
      - name: Install NDK and SDK packages
        shell: bash
        run: |
          set -euo pipefail
          set -x
          # Find the sdkmanager that the runner provides.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "Android SDK not found at $SDK" >&2
            exit 1
          fi
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          SDKMANAGER="$(find "$SDK" -name sdkmanager -type f -executable | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK" >&2
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          echo "SDK root: $SDK"

          # Accept all licences non-interactively, then install.
          # The `yes |` guards both --licenses and --install (sdkmanager can
          # prompt mid-install for individual package licences).
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="$SDK" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

          echo "--- verifying NDK ---"
          ls -1 "$SDK/ndk"
          test -d "$SDK/ndk/27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # debug.keystore is gitignored but the debug signing config requires it.
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Show native libraries
        if: always()
        run: |
          find app/build -name "*.so" -exec ls -lh {} \; || echo "no .so produced"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: androidharness-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/outputs/logs/**
            **/build/reports/**
            /tmp/*.log
          if-no-files-found: ignore
          retention-days: 7
