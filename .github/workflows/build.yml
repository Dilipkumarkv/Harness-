# Build the on-device APK with NDK 27.2
#
# Compiles llama.cpp (fetched by CMake at build time) into libharness_llama.so,
# packages it with the Kotlin code, and uploads an installable debug APK.
#
# Download: Actions run page -> Artifacts -> "androidharness-debug".

name: Build AndroidHarness (on-device llama.cpp)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The ubuntu runner already ships an Android SDK with cmdline-tools, so use
      # sdkmanager directly. No third-party setup action in the path.
      - name: Install NDK and SDK packages
        shell: bash
        run: |
          set -x
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK" -name sdkmanager -type f | head -n 1)"
          fi
          echo "sdkmanager=$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # `yes |` also guards the install: sdkmanager can prompt for a licence
          # mid-install and would otherwise block until the job timeout.
          yes | "$SDKMANAGER" --sdk_root="$SDK" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"
          echo "--- installed ndk ---"
          ls -1 "$SDK/ndk"
          test -d "$SDK/ndk/27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # debug.keystore is gitignored but the debug signing config requires it.
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Show native libraries
        if: always()
        run: |
          find app/build -name "*.so" -exec ls -lh {} \; || echo "no .so produced"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: androidharness-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/outputs/logs/**
            **/build/reports/**
            /tmp/*.log
          if-no-files-found: ignore
          retention-days: 7
