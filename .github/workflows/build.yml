# Build the on-device APK with NDK 27.2
#
# This workflow compiles the llama.cpp native library and packages everything into
# an installable debug APK. The artifact is uploaded so you can download it from
# the Actions run page — no local NDK/CMake/gradle required.
#
# Trigger: push to main, or run manually from the Actions tab.

name: Build AndroidHarness (on-device llama.cpp)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  assemble:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install NDK 27.2
        uses: android-actions/setup-android@v3
        with:
          ndk-version: "27.2.12479018"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug
        env:
          # Prevent the secrets plugin from failing the CI build when .env is missing
          SECRETS_PLUGIN_FAIL_ON_MISSING_FILES: "false"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: androidharness-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Print APK size
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "APK: $(du -h $APK | cut -f1)"
